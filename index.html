<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDIA-3126-Assignment-1</title>

    <style>
      .c-button {
        padding: 10px;
        font-family: sans-serif;
        color: black;
        background-color: white;
        border-radius: 25px;
        margin: 20px;
        width: 120px;
      }
      .c-button.c-button--primary {
        color: white;
        background-color: green;
      }
      .c-button.c-button--secondary {
        color: white;
        background-color: gray;
      }
      .c-button.c-button--disabled {
        color: white;
        background-color: lightgray;
        cursor: not-allowed;
      }
      .c-button.c-button--transparent {
        color: black;
        background-color: transparent;
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <h2>Primary</h2>
    <button class="c-button c-button--primary">Primary</button>
    <h2>Secondary</h2>
    <button class="c-button c-button--secondary">Secondary</button>
    <h2>Disabled</h2>
    <button class="c-button c-button--disabled">Disabled</button>
    <h2>Transparent</h2>
    <button class="c-button c-button--transparent">Transparent</button>
  </body>
</html>
